<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Monitor</title>
    <style>
      :root { color-scheme: dark; --surface: #15171b; --panel: #1d2026; --line: #30343b; --text: #f3f4f6; --muted: #a4acba; --accent: #8da5ff; --orange: #f2a65a; --red: #ff7777; }
      * { box-sizing: border-box; }
      body { width: 390px; margin: 0; padding: 10px; background: var(--surface); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      button, input, textarea, select { font: inherit; }
      button { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--text); background: var(--panel); font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status-card, .settings-card { padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
      .status-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .task-status { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
      .task-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .task-status.ongoing::before { background: #42c777; }
      .task-status.paused::before, .task-status.blocked::before { background: var(--orange); }
      .task-status.error::before { background: var(--red); }
      .worked { color: var(--muted); font-size: 11px; }
      .status-detail { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .status-detail[hidden] { display: none; }
      .status-detail.error { color: var(--red); }
      .progress { height: 4px; margin-top: 6px; overflow: hidden; border-radius: 99px; background: #2b3038; }
      .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
      .progress.thinking > div { background: var(--orange); }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
      .actions button { flex: 1; }
      .monitor-button { background: var(--accent); color: #101421; border-color: transparent; }
      .monitor-button.stop { background: var(--panel); color: var(--text); border-color: var(--line); }
      .pause-button, .swap-button, .retry-button { display: none; }
      .pause-button.visible, .swap-button.visible, .retry-button.visible { display: block; }
      .retry-button { margin-top: 8px; }
      .prompt-section, .settings-card { margin-top: 8px; }
      .prompt-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
      .prompt-top label { font-weight: 700; }
      .slots { display: flex; gap: 4px; margin-left: auto; }
      .slots button { min-width: 29px; padding: 4px 7px; font-size: 12px; color: var(--muted); }
      .slots button.active { color: #101421; background: var(--accent); border-color: var(--accent); }
      textarea { display: block; width: 100%; height: 182px; min-height: 100px; max-height: 260px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; background: var(--panel); color: var(--text); line-height: 1.45; }
      :is(button, textarea, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .settings-row { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 6px; }
      .model-row { grid-template-columns: auto minmax(0, 1fr) 112px; align-items: end; margin-bottom: 6px; }
      .model-toggle { display: grid; place-items: center; width: 28px; height: 30px; cursor: pointer; }
      .model-toggle input { margin: 0; width: 15px; height: 15px; accent-color: var(--accent); }
      .workflow-toggle { display: flex; align-items: center; gap: 6px; width: fit-content; margin-top: 6px; cursor: pointer; }
      .workflow-toggle input { margin: 0; accent-color: var(--accent); }
      .field { display: grid; gap: 2px; min-width: 0; color: var(--muted); font-size: 11px; }
      .field :is(input, select) { width: 100%; min-width: 0; height: 30px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--surface); font-size: 13px; }
      .field :disabled { opacity: .55; }
      .prompt-state { color: var(--muted); font-size: 11px; }
      .logs { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 5px; border-top: 1px solid var(--line); }
      .logs button { padding: 3px 0; border: 0; background: transparent; color: var(--accent); font-weight: 500; }
      #logFolderStatus { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #notice { margin-top: 6px; text-align: center; color: var(--muted); font-size: 11px; }
      #notice:empty { display: none; }
    </style>
  </head>
  <body>
    <section class="status-card">
      <div class="status-row"><span class="task-status" id="taskStatus">Connecting</span><span class="worked" id="workedText">0m / 130m</span></div>
      <div class="status-detail" id="statusDetail" hidden></div>
      <div class="progress" id="progress" role="progressbar" aria-label="Handoff progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div>
      <button class="retry-button" id="retryButton">Retry</button>
    </section>
    <div class="actions"><button class="monitor-button" id="monitorButton" disabled>Monitor this tab</button><button class="pause-button" id="pauseButton">Pause</button><button class="swap-button" id="swapButton">Handoff</button></div>
    <section class="settings-card" aria-label="Monitor settings">
      <div class="settings-row model-row">
        <label class="model-toggle" title="Apply model and reasoning automatically"><input id="enforceModelPreferences" type="checkbox" aria-label="Apply model and reasoning automatically" disabled checked /></label>
        <label class="field" for="preferredModel">Model <select id="preferredModel" disabled>
          <option value="">Keep current</option>
          <option value="GPT-6">GPT-6</option>
          <option value="GPT-5.6 Sol">GPT-5.6 Sol</option>
          <option value="GPT-5.5">GPT-5.5</option>
        </select></label>
        <label class="field" for="preferredReasoning">Reasoning <select id="preferredReasoning" disabled><option value="">Keep current</option><option value="instant">Instant</option><option value="medium">Medium</option><option value="high">High</option></select></label>
      </div>
      <div class="settings-row">
        <label class="field" for="thinkingMinutes">Thinking (min)<input id="thinkingMinutes" type="number" min="1" max="60" disabled /></label>
        <label class="field" for="threshold">Handoff (min)<input id="threshold" type="number" min="1" max="720" disabled /></label>
        <label class="field" for="pluginName">Plugin <input id="pluginName" type="text" placeholder="DevSpace" spellcheck="false" disabled /></label>
      </div>
      <label class="workflow-toggle" title="Cycle through your prompt, Continue, workflow review, and Continue with housekeeping">
        <input id="reviewWorkflow" type="checkbox" disabled /> Review workflow
      </label>
    </section>

    <div id="notice" role="status"></div>
    <section class="prompt-section">
      <div class="prompt-top"><label for="continuePrompt">Continue prompt</label><span class="prompt-state" id="promptState" role="status"></span><div class="slots" id="presetSlots" role="group" aria-label="Continue prompt presets">
        <button type="button" data-preset="0" aria-label="Prompt preset 1" disabled>1</button>
        <button type="button" data-preset="1" aria-label="Prompt preset 2" disabled>2</button>
        <button type="button" data-preset="2" aria-label="Prompt preset 3" disabled>3</button>
        <button type="button" data-preset="3" aria-label="Prompt preset 4" disabled>4</button>
      </div></div>
      <textarea id="continuePrompt" maxlength="12000" spellcheck="true" placeholder="Type a continue prompt" disabled></textarea>
    </section>

    <div class="logs"><span id="logFolderStatus" title="Automatic diagnostic logs">Logs: no folder</span><button id="chooseLogFolder">Logs</button></div>
    <script src="log-files.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
