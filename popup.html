<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Monitor</title>
    <style>
      :root { color-scheme: dark; --surface: #14161a; --panel: #1b1e24; --line: #30353e; --text: #eef0f5; --muted: #a2aab8; --accent: #a8baff; --orange: #f2a65a; --red: #ff8585; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { width: 390px; margin: 0; padding: 14px; background: var(--surface); color: var(--text); font: 13px/1.45 system-ui, sans-serif; }
      button, input, textarea, select { font: inherit; }
      button { border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; color: var(--text); background: var(--panel); font-weight: 600; cursor: pointer; transition: background .12s, border-color .12s; }
      button:hover:not(:disabled) { border-color: #69758b; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status-card, .settings-card { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
      .status-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .task-status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; }
      .task-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .task-status.ongoing::before { background: #42c777; }
      .task-status.paused::before, .task-status.blocked::before { background: var(--orange); }
      .task-status.error::before { background: var(--red); }
      .worked { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .status-detail { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .status-detail[hidden] { display: none; }
      .status-detail.error { color: var(--red); }
      .progress { appearance: none; display: block; width: 100%; height: 16px; margin: 0; background: transparent; cursor: ew-resize; }
      .progress::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--handoff-fill, 0%), #2b3038 var(--handoff-fill, 0%)); }
      .progress::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; margin-top: -3px; border-radius: 50%; background: var(--accent); }
      .progress:disabled { cursor: default; }
      .progress:disabled::-webkit-slider-thumb { opacity: 0; }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      .actions button { flex: 1; }
      .monitor-button { background: var(--accent); color: #101421; border-color: transparent; }
      .monitor-button.stop { background: var(--panel); color: var(--text); border-color: var(--line); }
      .pause-button, .swap-button, .retry-button { display: none; }
      .pause-button.visible, .swap-button.visible, .retry-button.visible { display: block; }
      .retry-button { margin-top: 8px; }
      .prompt-section, .settings-card { margin-top: 12px; }
      .prompt-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
      .prompt-top label { font-size: 12px; font-weight: 600; }
      .slots { display: flex; gap: 4px; margin-left: auto; }
      .slots button { min-width: 28px; padding: 3px 7px; font-size: 12px; color: var(--muted); }
      .slots button.active { color: #101421; background: var(--accent); border-color: var(--accent); }
      textarea { display: block; width: 100%; height: 174px; min-height: 100px; max-height: 260px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; resize: vertical; background: var(--panel); color: var(--text); line-height: 1.55; }
      :is(button, textarea, input, select):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .settings-row { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
      .model-row { grid-template-columns: auto minmax(0, 1fr) 108px; align-items: end; margin-bottom: 10px; }
      .settings-card.gemini { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 10px; }
      .settings-card.gemini .model-row { grid-template-columns: 22px minmax(0, 1fr); margin-bottom: 0; gap: 4px; }
      .settings-card.gemini > .settings-row:not(.model-row) { grid-template-columns: minmax(0, 1fr); }
      .settings-card.gemini .cycle-options { grid-column: 1 / -1; margin-top: 0; padding-top: 10px; border-top: 1px solid var(--line); }
      .model-toggle { display: grid; place-items: center; width: 22px; height: 34px; cursor: pointer; }
      .model-toggle input { margin: 0; width: 15px; height: 15px; accent-color: var(--accent); }
      .workflow-toggle, .cycle-option { display: flex; align-items: center; gap: 6px; }
      .workflow-toggle { cursor: pointer; }
      .workflow-toggle input { margin: 0; accent-color: var(--accent); }
      .cycle-options { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
      .send-now { width: 26px; height: 26px; padding: 0; border-radius: 6px; background: var(--surface); color: var(--accent); }
      #cycleStage { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .field { display: grid; gap: 4px; min-width: 0; color: var(--muted); font-size: 11px; }
      .field :is(input, select) { width: 100%; min-width: 0; height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: var(--surface); font-size: 13px; }
      .field :disabled { opacity: .55; }
      .prompt-state { color: var(--muted); font-size: 11px; }
      .logs { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
      .logs button { padding: 3px 0; border: 0; background: transparent; color: var(--accent); font-weight: 500; }
      #logFolderStatus { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #notice { margin-top: 6px; text-align: center; color: var(--muted); font-size: 11px; }
      #notice:empty { display: none; }
    </style>
  </head>
  <body>
    <section class="status-card">
      <div class="status-row"><span class="task-status" id="taskStatus">Connecting</span><span class="worked" id="workedText">0m / 150m</span></div>
      <div class="status-detail" id="statusDetail" hidden></div>
      <input class="progress" id="progress" type="range" min="0" max="150" value="0" aria-label="Handoff progress" title="Drag to set minutes already worked toward handoff" disabled />
      <button class="retry-button" id="retryButton">Retry</button>
    </section>
    <div class="actions"><button class="monitor-button" id="monitorButton" disabled>Monitor this tab</button><button class="pause-button" id="pauseButton">Pause</button><button class="swap-button" id="swapButton">Handoff</button></div>
    <section class="settings-card" aria-label="Monitor settings">
      <div class="settings-row model-row">
        <label class="model-toggle" title="Apply model and reasoning automatically"><input id="enforceModelPreferences" type="checkbox" aria-label="Apply model and reasoning automatically" disabled checked /></label>
        <label class="field" for="preferredModel">Model <select id="preferredModel" disabled>
          <option value="">Keep current</option>
          <option value="GPT-6.2">GPT-6.2</option>
          <option value="GPT-6">GPT-6</option>
          <option value="GPT-5.6 Sol">GPT-5.6 Sol</option>
        </select></label>
        <label class="field" for="preferredReasoning">Reasoning <select id="preferredReasoning" disabled><option value="">Keep current</option><option value="instant">Instant</option><option value="medium">Medium</option><option value="high">High</option></select></label>
      </div>
      <div class="settings-row">
        <label class="field" for="thinkingMinutes">Thinking (min)<input id="thinkingMinutes" type="number" min="1" max="60" disabled /></label>
        <label class="field" for="threshold">Handoff (min)<input id="threshold" type="number" min="1" max="720" disabled /></label>
        <label class="field" for="pluginName">Plugin <input id="pluginName" type="text" placeholder="DevSpace" spellcheck="false" disabled /></label>
      </div>
      <div class="cycle-options">
        <div class="cycle-option">
          <label class="workflow-toggle"><input id="reviewWorkflow" type="checkbox" disabled /> Improve</label>
          <button class="send-now" type="button" data-send-now="improve" aria-label="Send Improve now" title="Stop reply and send Improve" disabled>↗</button>
        </div>
        <div class="cycle-option">
          <label class="workflow-toggle"><input id="housekeeping" type="checkbox" disabled /> Housekeeping</label>
          <button class="send-now" type="button" data-send-now="housekeeping" aria-label="Send Housekeeping now" title="Stop reply and send Housekeeping" disabled>↗</button>
        </div>
        <span id="cycleStage" role="status" hidden></span>
      </div>
    </section>

    <div id="notice" role="status"></div>
    <section class="prompt-section">
      <div class="prompt-top"><label for="continuePrompt">Goal prompt</label><span class="prompt-state" id="promptState" role="status"></span><div class="slots" id="presetSlots" role="group" aria-label="Goal prompt presets">
        <button type="button" data-preset="0" aria-label="Prompt preset 1" disabled>1</button>
        <button type="button" data-preset="1" aria-label="Prompt preset 2" disabled>2</button>
        <button type="button" data-preset="2" aria-label="Prompt preset 3" disabled>3</button>
        <button type="button" data-preset="3" aria-label="Prompt preset 4" disabled>4</button>
      </div></div>
      <textarea id="continuePrompt" maxlength="12000" spellcheck="true" placeholder="Type a continue prompt" disabled></textarea>
    </section>

    <div class="logs"><span id="logFolderStatus" title="Automatic diagnostic logs">Logs: no folder</span><button id="chooseLogFolder">Logs</button></div>
    <script src="log-files.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
