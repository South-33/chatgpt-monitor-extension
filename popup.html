<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Monitor</title>
    <style>
      :root { color-scheme: dark; --surface: #15171b; --panel: #1d2026; --line: #30343b; --text: #f3f4f6; --muted: #a4acba; --accent: #8da5ff; --orange: #f2a65a; --red: #ff7777; }
      * { box-sizing: border-box; }
      body { width: 390px; margin: 0; padding: 14px; background: var(--surface); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      button, input, textarea, select { font: inherit; }
      button { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; color: var(--text); background: var(--panel); font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status-card { padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
      .status-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .task-status { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
      .task-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .task-status.ongoing::before { background: #42c777; }
      .task-status.paused::before, .task-status.blocked::before { background: var(--orange); }
      .task-status.error::before { background: var(--red); }
      .worked, .muted { color: var(--muted); font-size: 11px; }
      .status-detail { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .status-detail[hidden] { display: none; }
      .status-detail.error { color: var(--red); }
      .progress { height: 4px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: #2b3038; }
      .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
      .progress.thinking > div { background: var(--orange); }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
      .actions button { flex: 1; }
      .monitor-button { background: var(--accent); color: #101421; border-color: transparent; }
      .monitor-button.stop { background: var(--panel); color: var(--text); border-color: var(--line); }
      .pause-button, .swap-button, .retry-button { display: none; }
      .pause-button.visible, .swap-button.visible, .retry-button.visible { display: block; }
      .retry-button { margin-top: 8px; }
      .prompt-section { margin-top: 16px; }
      .prompt-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .prompt-top label { font-weight: 700; }
      .slots { display: flex; gap: 4px; }
      .slots button { min-width: 29px; padding: 4px 7px; font-size: 12px; color: var(--muted); }
      .slots button.active { color: #101421; background: var(--accent); border-color: var(--accent); }
      textarea { width: 100%; height: 230px; min-height: 150px; max-height: 48vh; padding: 10px; border: 1px solid var(--line); border-radius: 9px; resize: vertical; background: var(--panel); color: var(--text); line-height: 1.5; }
      textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .model-row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; margin-top: 14px; }
      .model-row label { display: grid; gap: 5px; }
      .model-row input, .model-row select { width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: var(--panel); }
      .prompt-state { min-height: 17px; margin-top: 3px; text-align: right; color: var(--muted); font-size: 11px; }
      .bottom-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
      .bottom-row label { display: flex; align-items: center; gap: 5px; }
      .bottom-row input { width: 55px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: var(--panel); }
      .logs { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
      .logs button { padding: 3px 0; border: 0; background: transparent; color: var(--accent); font-weight: 500; }
      #logFolderStatus { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #version { color: var(--muted); font-size: 11px; }
      #notice { margin-top: 6px; text-align: center; color: var(--muted); font-size: 11px; }
      #notice:empty { display: none; }
    </style>
  </head>
  <body>
    <section class="status-card">
      <div class="status-row"><span class="task-status" id="taskStatus">Connecting</span><span class="worked" id="workedText">0m / 130m</span></div>
      <div class="status-detail" id="statusDetail" hidden></div>
      <div class="progress" id="progress" role="progressbar" aria-label="Handoff progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div>
      <button class="retry-button" id="retryButton">Retry</button>
    </section>
    <div class="actions"><button class="monitor-button" id="monitorButton" disabled>Monitor this tab</button><button class="pause-button" id="pauseButton">Pause</button><button class="swap-button" id="swapButton">Handoff</button></div>
    <div class="model-row">
      <label>Model <input id="preferredModel" list="modelChoices" placeholder="Keep current" maxlength="80" disabled /></label>
      <datalist id="modelChoices"><option value="GPT-5.6 Sol"></option><option value="GPT-6"></option><option value="GPT-5.5"></option></datalist>
      <label>Reasoning <select id="preferredReasoning" disabled><option value="">Keep current</option><option value="instant">Instant</option><option value="medium">Medium</option><option value="high">High</option></select></label>
    </div>

    <section class="prompt-section">
      <div class="prompt-top"><label for="continuePrompt">Continue prompt</label><div class="slots" id="presetSlots" role="group" aria-label="Continue prompt presets">
        <button type="button" data-preset="0" aria-label="Prompt preset 1" disabled>1</button>
        <button type="button" data-preset="1" aria-label="Prompt preset 2" disabled>2</button>
        <button type="button" data-preset="2" aria-label="Prompt preset 3" disabled>3</button>
        <button type="button" data-preset="3" aria-label="Prompt preset 4" disabled>4</button>
      </div></div>
      <textarea id="continuePrompt" spellcheck="true" placeholder="Type a continue prompt" disabled></textarea>
      <div class="prompt-state" id="promptState" role="status"></div>
    </section>

    <div class="bottom-row"><label for="thinkingMinutes">Long thinking <input id="thinkingMinutes" type="number" min="1" max="60" disabled /> min</label><label for="threshold">Handoff <input id="threshold" type="number" min="1" max="720" disabled /> min</label></div>
    <div class="bottom-row"><span id="version"></span></div>
    <div class="logs"><span id="logFolderStatus" title="Automatic diagnostic logs">Logs: no folder</span><button id="chooseLogFolder">Logs / folder</button></div>
    <div id="notice" role="status"></div>
    <script src="log-files.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
